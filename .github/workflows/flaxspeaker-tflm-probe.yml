name: FlaxSpeaker ESP32-S3 TFLM Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/flaxspeaker_tflm_probe/**"
      - "scripts/audit_flaxspeaker_tflite_exports.py"
      - "scripts/inspect_speaker_tflite.py"
      - "scripts/report_flaxspeaker_tflm_ops.py"
      - ".github/workflows/flaxspeaker-tflm-probe.yml"
  pull_request:
    paths:
      - "tests/flaxspeaker_tflm_probe/**"
      - "scripts/audit_flaxspeaker_tflite_exports.py"
      - "scripts/inspect_speaker_tflite.py"
      - "scripts/report_flaxspeaker_tflm_ops.py"
      - ".github/workflows/flaxspeaker-tflm-probe.yml"

jobs:
  build-probe:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Install pip and audit dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          python3 -m pip install --break-system-packages --upgrade huggingface_hub tflite
      - name: Audit pinned model exports
        run: python3 scripts/audit_flaxspeaker_tflite_exports.py --output-dir build/flaxspeaker-audit
      - name: Report model operators against probe resolver
        run: |
          python3 scripts/report_flaxspeaker_tflm_ops.py build/flaxspeaker-audit/model_int8/model_int8.tflite --output build/flaxspeaker-audit/flaxspeaker_tflm_ops_report.json
      - name: Stage INT8 model for firmware build
        run: |
          mkdir -p tests/flaxspeaker_tflm_probe/main
          cp build/flaxspeaker-audit/model_int8/model_int8.tflite tests/flaxspeaker_tflm_probe/main/model_int8.tflite
      - name: Fetch pinned TFLite schema header
        run: |
          rm -rf /tmp/tflite-micro
          mkdir -p /tmp/tflite-micro
          cd /tmp/tflite-micro
          git init
          git remote add origin https://github.com/tensorflow/tflite-micro.git
          git config core.sparseCheckout true
          git sparse-checkout set tensorflow/lite/schema
          git fetch --depth 1 origin ff8cff73024a520a6549c412cbd3c673a839c22a
          git checkout --detach FETCH_HEAD
          mkdir -p "$GITHUB_WORKSPACE/tests/flaxspeaker_tflm_probe/compat/tensorflow/lite/schema"
          cp tensorflow/lite/schema/schema_generated.h "$GITHUB_WORKSPACE/tests/flaxspeaker_tflm_probe/compat/tensorflow/lite/schema/schema_generated.h"
      - name: Build ESP32-S3 probe
        working-directory: tests/flaxspeaker_tflm_probe
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - name: Create merged flash image
        working-directory: tests/flaxspeaker_tflm_probe
        run: |
          . "$IDF_PATH/export.sh"
          idf.py merge-bin -o build/flaxspeaker_tflm_probe_merged.bin
      - name: Upload build and audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaxspeaker-tflm-probe
          path: |
            tests/flaxspeaker_tflm_probe/build/*.bin
            tests/flaxspeaker_tflm_probe/build/bootloader/*.bin
            tests/flaxspeaker_tflm_probe/build/partition_table/*.bin
            tests/flaxspeaker_tflm_probe/build/*.elf
            build/flaxspeaker-audit/flaxspeaker_tflite_audit_manifest.json
            build/flaxspeaker-audit/flaxspeaker_tflm_ops_report.json
          if-no-files-found: warn
